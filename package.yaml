# Package definition for herdr

package_name: herdr
github_repo: herdrdev/herdr
license: Apache-2.0
artifact_format: raw
description: "Terminal workspace manager for coding agents"

architectures:
  amd64:
    release_pattern: "herdr-linux-x86_64"
  arm64:
    release_pattern: "herdr-linux-aarch64"

# Opt into native Ubuntu builds (builder >= v.0.1a29). Packages without
# these are served from the Debian suites via the alias fallback.
ubuntu_distributions:
  - jammy
  - noble
  - resolute
